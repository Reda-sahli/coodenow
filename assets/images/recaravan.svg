<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reca-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="50%" stop-color="#0d3b2e" />
      <stop offset="100%" stop-color="#041812" />
    </linearGradient>
    <linearGradient id="leaf-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#reca-bg)" rx="16"/>

  <g transform="translate(400, 210)" text-anchor="middle">
    <!-- Mountain and Sun background -->
    <circle cx="0" cy="-40" r="60" fill="#f59e0b" opacity="0.8" />
    <polygon points="-120,40 -40,-60 40,40" fill="#042118" opacity="0.7" />
    <polygon points="-30,40 50,-80 130,40" fill="#093829" />

    <!-- Minimalist Caravan Icon -->
    <rect x="-65" y="-10" width="130" height="65" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="4" />
    <circle cx="-30" cy="55" r="16" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <circle cx="30" cy="55" r="16" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <rect x="-45" y="5" width="35" height="25" rx="4" fill="#38bdf8" />
    <rect x="5" y="5" width="40" height="40" rx="4" fill="#64748b" />

    <!-- Typography -->
    <text x="0" y="140" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="800" letter-spacing="2">ReCaravan</text>
    <text x="0" y="170" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Sustainable Eco-Living &amp; Nomadic Caravan Platform</text>
  </g>
</svg>
